[project]
name = "leadflow-fastapi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.8.0", "pydantic-settings>=2.4.0",
  "SQLAlchemy>=2.0.32", "asyncpg>=0.29.0", "alembic>=1.13.2", "PyJWT[crypto]>=2.9.0",
  "httpx>=0.27.0", "email-validator>=2.2.0", "slowapi>=0.1.9", "tenacity>=8.5.0", "orjson>=3.10.7",
  "resend>=2.4.0", "supabase>=2.7.4", "greenlet>=3.0.3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3.2", "pytest-asyncio>=0.23.8", "ruff>=0.5.6"]
